<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务流程图 - 留学申请管理系统</title>
  <script src="./assets/vendor/tailwind-runtime.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;background:#f5f7fb}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
    :root{--primary:#7c6aed;--primary-dark:#6957dc;--primary-soft:#f3f0ff;--line:#e7e7ef;--muted:#6b7280;--success:#15803d;--warning:#b45309;--danger:#dc2626}
    .app{min-height:100vh}.layout{display:flex;min-height:calc(100vh - 64px);align-items:flex-start}.main{flex:1;min-width:0;padding:24px 28px 48px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.page-head h1{margin:0 0 6px;font-size:26px}.page-head p{margin:0;color:var(--muted);font-size:13px}
    .btn{height:38px;padding:0 15px;border:1px solid #d7d7e2;border-radius:12px;background:#fff;color:#374151;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:#fafafe;border-color:#c8c3e8}.btn.primary{color:#fff;background:var(--primary);border-color:var(--primary)}.btn.primary:hover{background:var(--primary-dark)}.btn.danger{color:var(--danger);border-color:#fecaca}.btn.sm{height:31px;padding:0 10px;font-size:12px}.btn.icon{width:31px;padding:0}.hidden{display:none!important}
    .flow-shell{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 22px rgba(38,31,86,.05);overflow:hidden;min-height:680px}.flow-tabs{display:flex;align-items:stretch;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}.flow-tab{position:relative;flex:0 0 auto;border:0;background:transparent;padding:16px 15px 14px;color:#6b7280;font-size:13px;font-weight:600;white-space:nowrap}.flow-tab:hover{color:var(--primary-dark);background:#faf9ff}.flow-tab.active{color:var(--primary-dark)}.flow-tab.active:after{content:"";position:absolute;left:13px;right:13px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
    .canvas{padding:22px}.canvas-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:18px}.canvas-head h2{font-size:18px;margin:0 0 5px}.canvas-head p{font-size:12px;color:var(--muted);margin:0}.canvas-actions{display:flex;align-items:center;gap:10px}.flow-body{border-top:1px solid #f0eff5;padding-top:20px}.lane{border:1px solid var(--line);border-radius:15px;margin-bottom:16px;overflow:hidden}.lane:last-child{margin-bottom:0}.lane.single{border:0;border-radius:0}.lane-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#f7f6fb;border-bottom:1px solid var(--line)}.lane-title h3{font-size:14px;margin:0}.lane-title span{font-size:11px;color:#9ca3af}
    .steps{display:flex;align-items:stretch;gap:0;padding:22px 18px;overflow-x:auto;scrollbar-width:thin}.lane.single .steps{padding:10px 2px 20px}.step{position:relative;display:flex;flex-direction:column;min-width:154px;flex:1;max-width:220px;border:1px solid #dedbe9;border-radius:13px;background:#fff;padding:15px 13px;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.step:not(:last-child){margin-right:34px}.step:not(:last-child):after{content:"→";position:absolute;right:-25px;top:50%;transform:translateY(-50%);color:#aaa3c1;font-size:18px}.step:hover{transform:translateY(-2px);border-color:#bfb7e8;box-shadow:0 10px 22px rgba(61,49,126,.10)}.step-number{width:25px;height:25px;border-radius:8px;background:var(--primary-soft);color:var(--primary-dark);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:10px}.step h4{font-size:13px;margin:0 0 5px}.step p{font-size:11px;color:#7b8190;line-height:1.5;margin:0}.step.decision{border-style:dashed;border-color:#f0b665;background:#fffbf4}.step.decision .step-number{background:#fff0d9;color:var(--warning)}.step.done{border-color:#b8ddc3;background:#f7fcf8}.step.done .step-number{background:#e6f6ea;color:var(--success)}
    .modal{position:fixed;inset:0;background:rgba(17,24,39,.48);display:none;align-items:center;justify-content:center;z-index:140;padding:20px}.modal.show{display:flex}.dialog{width:min(980px,96vw);max-height:92vh;display:flex;flex-direction:column;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.22)}.dialog-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.dialog-head h3{font-size:16px;margin:0}.dialog-body{padding:18px 22px;overflow:auto}.dialog-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog-actions{display:flex;gap:10px}.close{width:32px;height:32px;border:0;border-radius:9px;background:#f5f5f8;color:#6b7280;font-size:20px}.editor-note{font-size:12px;color:#5f6472;line-height:1.6;margin:0 0 15px;padding:10px 12px;border-radius:10px;background:#f7f6fb}.editor-lane{border:1px solid var(--line);border-radius:14px;margin-bottom:15px;overflow:hidden}.editor-lane-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:#f7f6fb}.editor-lane-head h4{font-size:13px;margin:0}.editor-rows{padding:5px 14px}.editor-columns,.editor-row{display:grid;grid-template-columns:32px 1fr 1.2fr 1.15fr 108px 104px;gap:10px;align-items:center}.editor-columns{padding:10px 0 7px;border-bottom:1px solid #e5e4eb;color:#6b7280;font-size:11px;font-weight:600}.editor-columns span:first-child{text-align:center}.editor-row{padding:11px 0;border-bottom:1px solid #efeff4}.editor-row:last-child{border-bottom:0}.row-index{width:28px;height:28px;border-radius:8px;background:var(--primary-soft);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.input,.select{width:100%;height:38px;border:1px solid #d5d5df;border-radius:9px;background:#fff;color:#1f2937;outline:none;padding:0 10px;font-size:12px}.input:focus,.select:focus{border-color:#a89aee;box-shadow:0 0 0 3px rgba(124,106,237,.1)}.row-controls{display:flex;gap:5px}.row-controls button{width:30px;height:30px;border:1px solid #dddbe6;border-radius:8px;background:#fff;color:#6b7280}.row-controls button:hover{color:var(--primary-dark);border-color:#bfb7e8}.row-controls button.remove:hover{color:var(--danger);border-color:#fecaca}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#1f2937;color:#fff;padding:11px 17px;border-radius:10px;font-size:13px;transition:.2s;z-index:180}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1080px){.editor-columns{display:none}.editor-row{grid-template-columns:32px 1fr 1fr}.editor-row .page-select,.editor-row .type-select,.editor-row .row-controls{grid-column:auto}.editor-row .row-controls{justify-self:end}}
    @media(max-width:820px){#pbs-sidebar{display:none}.main{padding:20px 16px 40px}.canvas{padding:18px 14px}.canvas-head{flex-direction:column}.flow-tabs{padding:0 8px}.steps{flex-direction:column;overflow:visible}.step{max-width:none;width:100%}.step:not(:last-child){margin:0 0 34px}.step:not(:last-child):after{content:"↓";right:auto;left:50%;top:auto;bottom:-27px;transform:translateX(-50%)}.editor-row{grid-template-columns:30px 1fr}.editor-row>*:not(.row-index){grid-column:2}.editor-row .row-controls{justify-self:start}.dialog-foot{align-items:flex-start;flex-direction:column}.dialog-actions{width:100%;justify-content:flex-end}}
  </style>
  <link rel="stylesheet" href="./assets/css/pbs-theme.css">
  <script src="./assets/js/pbs-app.js" defer></script>
</head>
<body class="min-h-screen">
<div class="app">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="h-16 flex items-center justify-between px-6">
      <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#8B7CF6,#6A5AD8)"><span class="text-white font-bold text-lg">P</span></div><span class="text-xl font-semibold text-gray-800">留学申请管理系统</span></div>
      <div class="flex items-center gap-6"><button class="relative p-2 text-gray-500 hover:text-gray-700" onclick="showToast('暂无新的流程通知')"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg></button><div class="flex items-center gap-3 pl-6 border-l border-gray-200 relative"><span class="pbs-role-badge text-xs px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full font-medium">超级管理员</span><div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center cursor-pointer"><span class="text-white text-sm font-medium">管</span></div><span class="text-sm text-gray-700">演示管理员</span></div></div>
    </div>
  </header>
  <div class="layout">
    <aside id="pbs-sidebar" class="w-56 bg-white border-r border-gray-200 min-h-[calc(100vh-64px)] flex-shrink-0"></aside>
    <main class="main">
      <div class="page-head"><div><h1>业务流程图</h1><p>查看各角色关键步骤，点击流程卡片进入对应页面</p></div></div>
      <section class="flow-shell">
        <div class="flow-tabs" id="viewTabs" role="tablist" aria-label="业务流程视角"></div>
        <div class="canvas">
          <div class="canvas-head">
            <div><h2 id="flowTitle">主业务流程</h2><p id="flowDescription">申请服务与选校咨询两类订单的完整链路</p></div>
            <div class="canvas-actions"><button class="btn" id="editFlowButton" onclick="openFlowEditor()">编辑流程卡片</button></div>
          </div>
          <div class="flow-body" id="flowBody" role="tabpanel"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal" id="flowEditorModal" role="dialog" aria-modal="true" aria-labelledby="flowEditorTitle">
  <div class="dialog">
    <div class="dialog-head"><h3 id="flowEditorTitle">编辑流程卡片</h3><button class="close" onclick="closeFlowEditor()" aria-label="关闭">×</button></div>
    <div class="dialog-body"><p class="editor-note"><strong>卡片标题</strong>填写流程节点名称；<strong>卡片说明</strong>填写该步骤的主要动作；<strong>跳转页面</strong>决定点击卡片后打开的页面；<strong>节点类型</strong>用于区分普通步骤、判断节点和完成节点。</p><div id="editorLanes"></div></div>
    <div class="dialog-foot"><button class="btn danger" onclick="resetCurrentFlow()">恢复默认</button><div class="dialog-actions"><button class="btn" onclick="closeFlowEditor()">取消</button><button class="btn primary" onclick="saveFlowEditor()">保存</button></div></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="./业务流程图 - 留学申请管理系统.js"></script>
</body>
</html>
