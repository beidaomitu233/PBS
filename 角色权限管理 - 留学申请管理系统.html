<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色权限管理 - 留学申请管理系统</title>
<script src="./assets/vendor/tailwind-runtime.js"></script>
<link rel="stylesheet" href="./assets/css/pbs-theme.css?v=6.7">
<link rel="stylesheet" href="./assets/css/pbs-permissions.css?v=2.7">
<script src="./assets/js/pbs-app.js?v=9.0" defer></script>
<script src="./assets/js/pbs-permissions.js?v=2.4" defer></script>
</head><body class="min-h-screen pbs-primary-page"><header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="h-16 flex items-center justify-between px-6">
      <div class="flex items-center gap-8">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 bg-white overflow-hidden"><img src="./PRD参考文件/导航栏图标参考.jpg" alt="PBS" class="w-full h-full object-contain"></div>
          <span class="text-xl font-semibold text-gray-800">留学申请管理系统</span>
        </div>
      </div>
      <div class="flex items-center gap-6">
        <button class="relative p-2 text-gray-500 hover:text-gray-700" data-dom-id="btn-notification">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
          </svg>
          <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        <!-- 用户头像 -->
        <div class="flex items-center gap-3 pl-6 border-l border-gray-200 relative" id="userMenuContainer">
          <span class="pbs-role-badge hidden sm:inline-block text-xs px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full font-medium">超级管理员</span><div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center cursor-pointer" onclick="toggleUserMenu()">
            <span class="text-white text-sm font-medium">测</span>
          </div>
          <span class="text-sm text-gray-700">测试账号</span>
          <!-- 用户菜单 -->
          <div class="absolute top-12 right-0 w-64 bg-white rounded-xl shadow-lg border border-gray-100 py-3 hidden" id="userMenu">
            <div class="px-5 py-3 border-b border-gray-100">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center">
                  <span class="text-white text-base font-medium">测</span>
                </div>
                <div>
                  <p class="text-sm font-semibold text-gray-900">测试账号</p>
                  <p class="text-xs text-gray-500">test@pbs.com</p>
                <p class="pbs-menu-role text-xs text-blue-600 mt-0.5">超级管理员 · PBS留学总部</p></div>
              </div>
            </div>
            <div class="py-1">
              <a class="flex items-center gap-3 px-5 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors" href="角色权限管理 - 留学申请管理系统.html">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                个人设置
              </a>
              <a class="flex items-center gap-3 px-5 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors" href="角色权限管理 - 留学申请管理系统.html">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                退出登录
              </a>
            </div>
            <div class="px-5 py-2 border-t border-gray-100">
              <p class="text-xs text-gray-400">PBS留学CRM v2.5</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
<div class="flex"><aside id="pbs-sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
<main class="flex-1 permission-workspace">
<section class="role-workspace-card"><div class="permission-title"><h1>角色权限管理</h1><button class="perm-btn primary" id="createRole" data-pbs-permission="sys_role_create"><span aria-hidden="true">＋</span> 新增角色</button></div>
<div class="permission-layout">
<section class="role-panel"><div class="role-panel-heading"><h2>角色</h2><span id="roleCount"></span></div><div class="role-search"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="roleSearch" class="perm-input" placeholder="搜索角色" aria-label="搜索角色"></div><div id="roleList" class="role-list"></div></section>
<section class="permission-panel"><div class="permission-panel-heading"><div><h2 id="roleName"></h2><p id="roleDescription"></p></div><div class="role-actions"><button class="perm-btn" id="editRole" data-pbs-permission="sys_role_edit">编辑角色</button><button class="perm-btn" id="copyRole" data-pbs-permission="sys_role_create">复制角色</button><button class="perm-btn danger" id="deleteRole" data-pbs-permission="sys_role_delete">删除角色</button></div></div>
<div class="permission-toolbar"><input class="perm-input" id="permissionSearch" placeholder="搜索页面或操作权限" aria-label="搜索页面或操作权限"><div><label class="perm-check"><input type="checkbox" id="selectAllPermissions">全选</label><button class="perm-text" id="expandPermissions">全部展开</button><button class="perm-text" id="collapsePermissions">全部收起</button></div></div>
<div id="permissionTree" class="permission-tree" aria-label="应用权限"></div>
<div class="permission-footer"><span id="permissionSummary" aria-live="polite"></span><div><button class="perm-btn" id="resetPermissions">取消修改</button><button class="perm-btn primary" id="savePermissions" data-pbs-permission="sys_role_save">保存权限</button></div></div>
</section></div></section></main></div>
<dialog id="roleDialog" class="role-dialog"><form id="roleForm"><div class="role-dialog-head"><h2 id="roleDialogTitle">新增角色</h2><button type="button" class="perm-close" data-close-dialog aria-label="关闭">×</button></div><div class="role-dialog-body"><label>角色名称 <span class="required">*</span><input id="roleFormName" class="perm-input" required maxlength="30" autocomplete="off"></label><label>角色描述<textarea id="roleFormDescription" class="perm-input" rows="3" maxlength="120"></textarea></label><fieldset><legend>状态</legend><label class="perm-check"><input type="radio" name="roleStatus" value="启用" checked>启用</label><label class="perm-check"><input type="radio" name="roleStatus" value="停用">停用</label></fieldset><p id="roleFormError" role="alert"></p></div><div class="role-dialog-foot"><button type="button" class="perm-btn" data-close-dialog>取消</button><button class="perm-btn primary" type="submit">确定</button></div></form></dialog>
<dialog id="permissionConfirm" class="role-dialog confirm-dialog"><div class="role-dialog-head"><h2 id="confirmTitle"></h2></div><p id="confirmMessage"></p><div class="role-dialog-foot"><button class="perm-btn" id="confirmCancel">取消</button><button class="perm-btn primary" id="confirmAccept">确定</button></div></dialog>
<div id="permissionToast" class="permission-toast" role="status" hidden></div>
</body></html>
