<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务流程图 - 留学申请管理系统</title>
  <script src="./用户管理 - 留学申请管理系统_files/saved_resource"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;background:#f5f7fb}button{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}
    :root{--primary:#7c6aed;--primary-dark:#6957dc;--primary-soft:#f3f0ff;--line:#e7e7ef;--muted:#6b7280;--success:#15803d;--warning:#b45309}
    .app{min-height:100vh}.layout{display:flex;min-height:calc(100vh - 64px);align-items:flex-start}.main{flex:1;min-width:0;padding:24px 28px 48px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.page-head h1{margin:0 0 6px;font-size:26px}.page-head p{margin:0;color:var(--muted);font-size:13px}.btn{height:38px;padding:0 15px;border:1px solid #d7d7e2;border-radius:12px;background:#fff;color:#374151;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:#fafafe;border-color:#c8c3e8}.btn.primary{color:#fff;background:var(--primary);border-color:var(--primary)}
    .workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}.view-list,.canvas{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 22px rgba(38,31,86,.05)}.view-list{padding:12px;position:sticky;top:84px}.view-group{font-size:11px;color:#9ca3af;font-weight:600;padding:9px 11px 6px}.view-btn{width:100%;border:0;background:transparent;border-radius:11px;padding:10px 12px;margin:2px 0;text-align:left;color:#4b5563;font-size:13px;display:flex;align-items:center;gap:10px}.view-btn:before{content:"";width:7px;height:7px;border-radius:50%;background:#d1d5db;flex:0 0 auto}.view-btn:hover{background:#f7f6fb}.view-btn.active{background:var(--primary-soft);color:var(--primary-dark);font-weight:600}.view-btn.active:before{background:var(--primary)}
    .canvas{padding:22px;min-height:650px}.canvas-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid #f0eff5}.canvas-head h2{font-size:18px;margin:0 0 5px}.canvas-head p{font-size:12px;color:var(--muted);margin:0}.canvas-meta{font-size:12px;color:#9ca3af;white-space:nowrap;padding-top:4px}.flow-body{padding-top:20px}.lane{border:1px solid var(--line);border-radius:15px;margin-bottom:16px;overflow:hidden}.lane:last-child{margin-bottom:0}.lane-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#f7f6fb;border-bottom:1px solid var(--line)}.lane-title h3{font-size:14px;margin:0}.lane-title span{font-size:11px;color:#9ca3af}.steps{display:flex;align-items:stretch;gap:0;padding:22px 18px;overflow-x:auto}.step{position:relative;min-width:138px;flex:1;border:1px solid #dedbe9;border-radius:13px;background:#fff;padding:15px 13px}.step:not(:last-child){margin-right:34px}.step:not(:last-child):after{content:"→";position:absolute;right:-25px;top:50%;transform:translateY(-50%);color:#aaa3c1;font-size:18px}.step-number{width:25px;height:25px;border-radius:8px;background:var(--primary-soft);color:var(--primary-dark);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:10px}.step h4{font-size:13px;margin:0 0 5px}.step p{font-size:11px;color:#7b8190;line-height:1.5;margin:0}.step.decision{border-style:dashed;border-color:#f0b665;background:#fffbf4}.step.decision .step-number{background:#fff0d9;color:var(--warning)}.step.done{border-color:#b8ddc3;background:#f7fcf8}.step.done .step-number{background:#e6f6ea;color:var(--success)}
    .role-flow{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}.role-main{border:1px solid var(--line);border-radius:15px;padding:20px}.role-main .steps{padding:4px 0 10px}.side-info{display:flex;flex-direction:column;gap:14px}.info-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fcfcfe}.info-card h3{font-size:13px;margin:0 0 10px}.info-row{padding:9px 0;border-bottom:1px solid #efeff4}.info-row:last-child{border-bottom:0}.info-row b{display:block;font-size:12px;margin-bottom:3px}.info-row span{font-size:11px;color:#7b8190}.page-link{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #efeff4;font-size:12px;color:#4b5563}.page-link:last-child{border-bottom:0}.page-link:hover{color:var(--primary-dark)}.page-link:after{content:"›";font-size:18px;color:#aaa3c1}.hint{margin-top:16px;padding:11px 13px;border-radius:12px;background:#f7f6fc;color:#6b7280;font-size:12px;line-height:1.5}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#1f2937;color:#fff;padding:11px 17px;border-radius:10px;font-size:13px;transition:.2s;z-index:180}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1160px){.workspace{grid-template-columns:200px minmax(0,1fr)}.role-flow{grid-template-columns:1fr}.side-info{display:grid;grid-template-columns:1fr 1fr}}
    @media(max-width:820px){#pbs-sidebar{display:none}.main{padding:20px 16px 40px}.workspace{grid-template-columns:1fr}.view-list{position:static;display:flex;overflow:auto;gap:6px;padding:10px}.view-group{display:none}.view-btn{width:auto;white-space:nowrap}.canvas-head{flex-direction:column}.side-info{grid-template-columns:1fr}.steps{flex-direction:column}.step:not(:last-child){margin:0 0 34px}.step:not(:last-child):after{content:"↓";right:auto;left:50%;top:auto;bottom:-27px;transform:translateX(-50%)}}
  </style>
  <link rel="stylesheet" href="./用户管理 - 留学申请管理系统_files/pbs-theme.css">
  <script src="./用户管理 - 留学申请管理系统_files/pbs-app.js.下载" defer></script>
</head>
<body class="min-h-screen">
<div class="app">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="h-16 flex items-center justify-between px-6">
      <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#8B7CF6,#6A5AD8)"><span class="text-white font-bold text-lg">P</span></div><span class="text-xl font-semibold text-gray-800">留学申请管理系统</span></div>
      <div class="flex items-center gap-6"><button class="relative p-2 text-gray-500 hover:text-gray-700" onclick="showToast('暂无新的流程通知')"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg></button><div class="flex items-center gap-3 pl-6 border-l border-gray-200 relative"><span class="pbs-role-badge text-xs px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full font-medium">超级管理员</span><div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center cursor-pointer"><span class="text-white text-sm font-medium">管</span></div><span class="text-sm text-gray-700">演示管理员</span></div></div>
    </div>
  </header>
  <div class="layout">
    <aside id="pbs-sidebar" class="w-56 bg-white border-r border-gray-200 min-h-[calc(100vh-64px)] flex-shrink-0"></aside>
    <main class="main">
      <div class="page-head"><div><h1>业务流程图</h1><p>按业务全景或角色查看关键流程</p></div><button class="btn" onclick="showToast('已切换为适应画布')">适应画布</button></div>
      <div class="workspace">
        <nav class="view-list" id="viewList" aria-label="流程视角"></nav>
        <section class="canvas" aria-live="polite">
          <div class="canvas-head"><div><h2 id="flowTitle">主业务流程</h2><p id="flowDescription">申请服务与选校咨询两类订单的完整链路</p></div><div class="canvas-meta" id="flowMeta">业务全景</div></div>
          <div class="flow-body" id="flowBody"></div>
        </section>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="./业务流程图 - 留学申请管理系统.js"></script>
</body>
</html>
