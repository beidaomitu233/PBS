<body class="bg-gray-50 text-gray-800 min-h-screen">
  <header class="h-16 bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="h-full px-6 flex items-center justify-between">
      <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl overflow-hidden bg-white flex items-center justify-center flex-shrink-0"><img src="./PRD参考文件/导航栏图标参考.jpg" alt="PBS" class="w-full h-full object-contain"></div><div><p class="text-sm font-semibold text-gray-900">PBS 留学申请管理平台</p><p class="text-xs text-gray-400">系统内容管理</p></div></div>
      <div class="flex items-center gap-4"><button data-dom-id="btn-notification" class="relative w-9 h-9 rounded-lg text-gray-500 hover:bg-gray-100" aria-label="系统消息">🔔</button><span class="pbs-role-badge text-xs px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full font-medium">平台运维人员</span><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 text-white flex items-center justify-center"><span class="text-sm">运</span></div><span class="text-sm text-gray-700">平台运维</span></div></div>
    </div>
  </header>

  <div class="flex">
    <aside id="pbs-sidebar" class="w-56 bg-white border-r border-gray-200 min-h-[calc(100vh-64px)] flex flex-col flex-shrink-0"></aside>
    <main class="video-page flex-1 min-w-0 p-6">
      <section class="video-workspace-card">
        <header class="video-workspace-head"><h1 class="video-page-title">视频管理</h1></header>

        <div class="video-workspace-body">
          <section class="video-content-section">
            <div class="video-content-head"><h2 class="video-card-title">首页介绍视频</h2></div>
            <div class="video-content-grid">
              <div class="video-preview-column">
                <button class="media-frame" onclick="previewIntroVideo()" aria-label="预览系统介绍视频"><span class="media-backdrop"></span><span class="media-copy"><span class="media-play"><span></span></span><span id="coverKicker" class="media-kicker">WELCOME TO PBS</span><span id="coverTitle" class="media-title">PBS 系统介绍视频</span><span id="coverSubtitle" class="media-desc">用 32 秒了解角色工作台与申请交付主流程</span></span><span id="coverDuration" class="media-duration">32 秒</span></button>
              </div>
              <div class="video-meta-panel">
                <div><h3 class="video-info-title">视频内容</h3><dl class="video-info-list"><div class="video-info-row"><dt>标题</dt><dd class="strong" id="videoMetaTitle">PBS 系统介绍视频</dd></div><div class="video-info-row"><dt>说明</dt><dd id="videoMetaSubtitle">用 32 秒了解角色工作台与申请交付主流程</dd></div><div class="video-info-row"><dt>更新时间</dt><dd id="contentUpdated">2026-08-19 18:30</dd></div></dl></div>
                <div class="media-toolbar">
                  <div class="video-file-summary"><span class="video-file-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m15 10 4.5-2.5v9L15 14v-4Z" stroke-width="1.8" stroke-linejoin="round"></path><rect x="3.5" y="6" width="11.5" height="12" rx="2" stroke-width="1.8"></rect></svg></span><span class="video-file-copy"><strong id="coverFileName">内置动态图文视频</strong><small id="uploadHint">支持 MP4、WebM、OGG，系统自动读取实际时长</small></span></div>
                  <div class="media-toolbar-actions"><button id="uploadTitle" class="video-upload-action" type="button" onclick="openVideoEditor()">上传视频</button></div>
                </div>
              </div>
            </div>
          </section>

          <section class="settings-section">
            <div class="settings-section-head"><h2 class="video-card-title">播放设置</h2><button onclick="saveVideoPolicy()" class="video-btn primary save-settings">保存设置</button></div>
            <div class="setting-grid">
              <div class="setting-row"><span class="setting-copy"><strong>启用介绍视频</strong></span><label class="switch"><input id="videoEnabled" type="checkbox" checked><span class="slider"></span></label></div>
              <div class="setting-row"><span class="setting-copy"><strong>首次自动播放</strong></span><label class="switch"><input id="autoPlayFirstVisit" type="checkbox" checked><span class="slider"></span></label></div>
              <div class="setting-row"><span class="setting-copy"><strong>允许关闭</strong></span><label class="switch"><input type="checkbox" checked disabled><span class="slider"></span></label></div>
            </div>
          </section>

          <section class="viewer-status-section">
            <div class="viewer-status-head"><h2 class="video-card-title">账号播放状态</h2><div class="viewer-status-actions"><div class="viewer-summary"><span><strong id="playedViewerCount">0</strong> 已播放</span><span><strong id="pendingViewerCount">0</strong> 待播放</span></div><button onclick="resetAllViewers()" class="video-btn">重置播放状态</button></div></div>
            <div class="viewer-table-wrap"><table class="viewer-table"><thead><tr><th>账号</th><th>姓名</th><th>机构</th><th>播放状态</th><th>播放时间</th></tr></thead><tbody id="viewerStatusRows"></tbody></table></div>
          </section>
        </div>
      </section>
    </main>
  </div>

    <div class="modal-card"><div class="flex items-center justify-between gap-4 px-6 py-5 border-b border-gray-100"><h2 id="videoEditorTitle" class="text-lg font-semibold text-gray-900">上传视频</h2><button onclick="closeVideoEditor()" class="w-8 h-8 rounded-lg bg-gray-100 text-gray-500 text-xl">×</button></div>

      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-100"><button onclick="closeVideoEditor()" class="h-10 px-5 border border-gray-300 text-gray-700 rounded-lg text-sm">取消</button><button id="saveVideoContentBtn" onclick="saveVideoContent()" class="h-10 px-5 bg-blue-600 text-white rounded-lg text-sm font-medium">保存</button></div>
    </div>
  </div>

      { username: 'essay_lin', realname: '林老师', org: '远景教育', played: false, playedTime: '—' }
    ];
    function readJson(key, fallback) { try { return Object.assign({}, fallback, JSON.parse(localStorage.getItem(key) || '{}')); } catch (e) { return Object.assign({}, fallback); } }
    function renderVideoPage() {
      currentMeta = readJson(META_KEY, defaultMeta);
      var policy = readJson(POLICY_KEY, { enabled: true, autoPlayFirstVisit: true, allowClose: true });
      document.getElementById('videoEnabled').checked = policy.enabled !== false;
      document.getElementById('autoPlayFirstVisit').checked = policy.autoPlayFirstVisit !== false;
      if (!currentMeta.subtitle && currentMeta.description) currentMeta.subtitle = currentMeta.description;
      document.getElementById('coverKicker').textContent = currentMeta.kicker || defaultMeta.kicker;
      document.getElementById('coverTitle').textContent = currentMeta.title;
      document.getElementById('coverSubtitle').textContent = currentMeta.subtitle || defaultMeta.subtitle;
      document.getElementById('videoMetaTitle').textContent = currentMeta.title;
      document.getElementById('videoMetaSubtitle').textContent = currentMeta.subtitle || defaultMeta.subtitle;
      document.getElementById('coverDuration').textContent = currentMeta.duration + ' 秒';
      document.getElementById('coverFileName').textContent = currentMeta.fileName || '内置动态图文视频';
      document.getElementById('uploadTitle').textContent = currentMeta.hasCustomVideo ? '替换视频' : '上传视频';
      document.getElementById('uploadHint').textContent = currentMeta.hasCustomVideo ? ((currentMeta.fileName || '当前视频') + ' · ' + currentMeta.duration + ' 秒') : '支持 MP4、WebM、OGG，系统自动读取实际时长';
      document.getElementById('contentUpdated').textContent = currentMeta.updated;
    }
    function renderViewerStatus() {
      var played = viewerStatusList.filter(function (item) { return item.played; }).length;
      document.getElementById('playedViewerCount').textContent = played;
      document.getElementById('pendingViewerCount').textContent = viewerStatusList.length - played;
      document.getElementById('viewerStatusRows').innerHTML = viewerStatusList.map(function (item) {
        return '<tr><td>' + item.username + '</td><td>' + item.realname + '</td><td>' + item.org + '</td><td><span class="viewer-result ' + (item.played ? 'played' : '') + '"><i></i>' + (item.played ? '已播放' : '待播放') + '</span></td><td>' + item.playedTime + '</td></tr>';
      }).join('');
    }
    function previewIntroVideo() { if (window.pbsOpenIntroVideo) window.pbsOpenIntroVideo(); else showVideoToast('播放器正在初始化，请稍后重试'); }
    function saveVideoPolicy() {
      var policy = { enabled: document.getElementById('videoEnabled').checked, autoPlayFirstVisit: document.getElementById('autoPlayFirstVisit').checked, allowClose: true };
      localStorage.setItem(POLICY_KEY, JSON.stringify(policy)); renderVideoPage(); showVideoToast('播放策略已保存并全站生效');
    }
    function resetAllViewers() { var keys = []; for (var i = 0; i < localStorage.length; i++) { var key = localStorage.key(i); if (key && key.indexOf('pbs_intro_video_seen_v1_') === 0) keys.push(key); } keys.forEach(function (key) { localStorage.removeItem(key); }); viewerStatusList = viewerStatusList.map(function (item) { return Object.assign({}, item, { played: false, playedTime: '—' }); }); renderViewerStatus(); showVideoToast('已重置所有账号播放状态'); }
    function openVideoDb() { return new Promise(function (resolve, reject) { if (!window.indexedDB) { reject(new Error('当前浏览器不支持本地视频存储')); return; } var request = indexedDB.open(VIDEO_DB_NAME, 1); request.onupgradeneeded = function () { var db = request.result; if (!db.objectStoreNames.contains(VIDEO_STORE_NAME)) db.createObjectStore(VIDEO_STORE_NAME, { keyPath: 'id' }); }; request.onsuccess = function () { resolve(request.result); }; request.onerror = function () { reject(request.error || new Error('视频存储初始化失败')); }; }); }
    function storeVideoFile(file) { return openVideoDb().then(function (db) { return new Promise(function (resolve, reject) { var tx = db.transaction(VIDEO_STORE_NAME, 'readwrite'); tx.objectStore(VIDEO_STORE_NAME).put({ id: VIDEO_ASSET_KEY, blob: file, name: file.name, type: file.type, size: file.size, savedAt: Date.now() }); tx.oncomplete = function () { db.close(); resolve(); }; tx.onerror = function () { db.close(); reject(tx.error || new Error('视频保存失败')); }; }); }); }
    function readVideoDuration(file) { return new Promise(function (resolve, reject) { var probe = document.createElement('video'); var url = URL.createObjectURL(file); probe.preload = 'metadata'; probe.onloadedmetadata = function () { var duration = Number(probe.duration); URL.revokeObjectURL(url); if (isFinite(duration) && duration > 0) resolve(duration); else reject(new Error('无法读取视频时长')); }; probe.onerror = function () { URL.revokeObjectURL(url); reject(new Error('无法读取该视频文件')); }; probe.src = url; }); }
    function prepareVideoUpload(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      if (!file.type || file.type.indexOf('video/') !== 0) { showVideoToast('请选择 MP4、WebM 或 OGG 视频文件'); input.value = ''; return; }
      var fileName = document.getElementById('videoEditorFileName');
      fileName.textContent = '正在读取 ' + file.name;
      readVideoDuration(file).then(function (duration) {
        pendingVideoFile = file;
        pendingVideoDuration = Number(duration.toFixed(2));
        fileName.textContent = file.name + ' · ' + pendingVideoDuration + ' 秒';
      }).catch(function (error) {
        pendingVideoFile = null;
        pendingVideoDuration = null;
        input.value = '';
        fileName.textContent = currentMeta.fileName || '选择视频文件';
        showVideoToast(error && error.message ? error.message : '无法读取该视频文件');
      });
    }
    function openVideoEditor() {
      pendingVideoFile = null;
      pendingVideoDuration = null;
      document.getElementById('videoEditorFile').value = '';
      document.getElementById('videoEditorTitle').textContent = currentMeta.hasCustomVideo ? '替换视频' : '上传视频';
      document.getElementById('videoEditorFileName').textContent = currentMeta.fileName || '选择视频文件';
      document.getElementById('editVideoTitle').value = currentMeta.title;
      document.getElementById('editVideoSubtitle').value = currentMeta.subtitle || currentMeta.description || defaultMeta.subtitle;
      document.getElementById('videoEditorModal').classList.add('show');
    }
    function closeVideoEditor() { document.getElementById('videoEditorModal').classList.remove('show'); }
    function saveVideoContent() {
      var title = document.getElementById('editVideoTitle').value.trim();
      var subtitle = document.getElementById('editVideoSubtitle').value.trim();
      if (!title || !subtitle) { showVideoToast('请填写视频标题和说明'); return; }
      var button = document.getElementById('saveVideoContentBtn');
      button.disabled = true;
      button.textContent = '保存中…';
      var saveFile = pendingVideoFile ? storeVideoFile(pendingVideoFile) : Promise.resolve();
      saveFile.then(function () {
        currentMeta = Object.assign({}, currentMeta, {
          kicker: currentMeta.kicker || defaultMeta.kicker,
          title: title,
          subtitle: subtitle,
          duration: pendingVideoFile ? pendingVideoDuration : (Number(currentMeta.duration) || defaultMeta.duration),
          updated: new Date().toLocaleString('zh-CN', { hour12: false })
        });
        if (pendingVideoFile) {
          currentMeta.fileName = pendingVideoFile.name;
          currentMeta.fileSize = pendingVideoFile.size;
          currentMeta.mimeType = pendingVideoFile.type;
          currentMeta.hasCustomVideo = true;
        }
        localStorage.setItem(META_KEY, JSON.stringify(currentMeta));
        closeVideoEditor();
        renderVideoPage();
        showVideoToast(pendingVideoFile ? '视频已替换' : '视频内容已保存');
      }).catch(function (error) {
        showVideoToast(error && error.message ? error.message : '保存失败，请重试');
      }).finally(function () {
        button.disabled = false;
        button.textContent = '保存';
      });
    }
    function showVideoToast(message) { var toast = document.getElementById('videoToast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(showVideoToast.timer); showVideoToast.timer = setTimeout(function () { toast.classList.remove('show'); }, 2200); }
    document.addEventListener('DOMContentLoaded', function () { renderVideoPage(); renderViewerStatus(); });
  </script>
</body>
</html>
