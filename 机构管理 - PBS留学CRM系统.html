<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机构管理 - PBS留学CRM系统</title>
  <script src="./assets/vendor/tailwind-runtime.js"></script>
  <link rel="stylesheet" href="./assets/css/pbs-theme.css?v=6.1">
  <style>
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    #pbs-sidebar { min-height: calc(100vh - 56px); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
  <header class="h-14 bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="h-full px-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 bg-white overflow-hidden"><img src="./PRD参考文件/导航栏图标参考.jpg" alt="PBS" class="w-full h-full object-contain"></div>
        <div><p class="text-sm font-semibold text-gray-900">PBS 留学申请管理平台</p><p class="text-xs text-gray-400">机构 SaaS 管理</p></div>
      </div>
      <div class="flex items-center gap-4">
        <button data-dom-id="btn-notification" class="relative w-9 h-9 rounded-lg text-gray-500 hover:bg-gray-100" aria-label="系统消息">🔔<span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-red-500"></span></button>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 text-white flex items-center justify-center"><span class="text-sm">王</span></div>
          <span class="text-sm text-gray-700">平台运营人员</span>
        </div>
      </div>
    </div>
  </header>

  <div class="flex">
    <aside id="pbs-sidebar" class="w-56 bg-white border-r border-gray-200 flex flex-col flex-shrink-0"></aside>
    <main class="flex-1 min-w-0 p-6">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-semibold text-gray-900">机构管理</h1>
          <p class="text-sm text-gray-400 mt-1">查看平台内机构及其 PBS 成员规模</p>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5"><p class="text-sm text-gray-500">机构总数</p><p id="organizationTotal" class="text-2xl font-semibold text-gray-900 mt-2">0</p></div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5"><p class="text-sm text-gray-500">已有成员机构</p><p id="organizationStaffed" class="text-2xl font-semibold text-gray-900 mt-2">0</p></div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5"><p class="text-sm text-gray-500">暂无成员机构</p><p id="organizationEmpty" class="text-2xl font-semibold text-gray-900 mt-2">0</p></div>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="p-5 border-b border-gray-100 flex items-end gap-3">
          <div class="w-80">
            <label class="block text-sm text-gray-600 mb-2" for="organizationSearch">关键词搜索</label>
            <input id="organizationSearch" type="search" class="w-full h-10 px-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="输入机构名称" oninput="renderOrganizations()">
          </div>
          <button type="button" class="h-10 px-5 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50" onclick="resetOrganizationSearch()">重置</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-5 py-4 text-left text-sm font-medium text-gray-500">机构名称</th>
                <th class="px-5 py-4 text-left text-sm font-medium text-gray-500">创建时间</th>
                <th class="px-5 py-4 text-left text-sm font-medium text-gray-500">机构成员</th>
                <th class="px-5 py-4 text-left text-sm font-medium text-gray-500">操作</th>
              </tr>
            </thead>
            <tbody id="organizationTableBody" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
        <div id="organizationEmptyState" class="hidden py-14 text-center text-sm text-gray-400">未找到匹配的机构</div>
      </div>
    </main>
  </div>

  <script src="./assets/js/pbs-organization-data.js"></script>
  <script>
    var organizations = (window.PBS_ORGANIZATIONS || []).slice();
    var memberCounts = { 'PBS留学总部': 2, '上海启明留学': 2, '北京知行教育': 1, '广州远航教育': 0, '深圳新途教育': 0 };

    function escapeHtml(value) {
      var element = document.createElement('div');
      element.textContent = value == null ? '' : String(value);
      return element.innerHTML;
    }
    function organizationAvatar(organization) {
      if (organization.avatar) {
        return '<span class="pbs-organization-avatar"><img src="' + escapeHtml(organization.avatar) + '" alt="' + escapeHtml(organization.name) + '机构头像"></span>';
      }
      return '<span class="pbs-organization-avatar" aria-label="' + escapeHtml(organization.name) + '机构头像">' + escapeHtml(organization.name.slice(0, 2)) + '</span>';
    }
    function renderOrganizations() {
      var keyword = document.getElementById('organizationSearch').value.trim().toLowerCase();
      var rows = organizations.filter(function (organization) { return !keyword || organization.name.toLowerCase().indexOf(keyword) >= 0; });
      var staffed = organizations.filter(function (organization) { return (memberCounts[organization.name] || 0) > 0; }).length;
      document.getElementById('organizationTotal').textContent = organizations.length;
      document.getElementById('organizationStaffed').textContent = staffed;
      document.getElementById('organizationEmpty').textContent = organizations.length - staffed;
      document.getElementById('organizationTableBody').innerHTML = rows.map(function (organization) {
        var count = memberCounts[organization.name] || 0;
        return '<tr class="hover:bg-gray-50 transition-colors">' +
          '<td class="px-5 py-4 text-sm font-medium text-gray-900"><div class="pbs-organization-cell">' + organizationAvatar(organization) + '<span>' + escapeHtml(organization.name) + '</span></div></td>' +
          '<td class="px-5 py-4 text-sm text-gray-600">' + escapeHtml(organization.createdAt) + '</td>' +
          '<td class="px-5 py-4"><span class="inline-flex px-2.5 py-1 rounded-full text-xs font-medium ' + (count ? 'bg-blue-50 text-blue-700' : 'bg-gray-100 text-gray-500') + '">' + count + ' 人</span></td>' +
          '<td class="px-5 py-4"><button type="button" class="text-sm text-blue-600 hover:text-blue-800 font-medium" onclick="openOrganizationMembers(\'' + organization.id + '\')">查看成员</button></td>' +
          '</tr>';
      }).join('');
      document.getElementById('organizationEmptyState').classList.toggle('hidden', rows.length > 0);
    }
    function resetOrganizationSearch() {
      document.getElementById('organizationSearch').value = '';
      renderOrganizations();
    }
    function openOrganizationMembers(id) {
      location.href = '人员管理 - PBS留学CRM系统.html?org=' + encodeURIComponent(id);
    }
    document.addEventListener('DOMContentLoaded', renderOrganizations);
  </script>
  <script src="./assets/js/pbs-app.js?v=6.0"></script>
</body>
</html>
