<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网申模板编辑 - 留学申请管理系统</title>
  <script src="./assets/vendor/tailwind-runtime.js"></script>
  <link rel="stylesheet" href="./assets/css/pbs-theme.css?v=6.1">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:calc(100vh - 64px);align-items:flex-start}.main{flex:1;min-width:0;padding:24px 28px 56px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}.input{width:100%;height:40px;border:1px solid #d1d5db;border-radius:9px;padding:0 12px;background:#fff;font-size:14px;outline:none}.input:focus,.textarea:focus{border-color:#7D94A6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}.textarea{width:100%;min-height:74px;border:1px solid #d1d5db;border-radius:9px;padding:10px 12px;background:#fff;font-size:14px;line-height:1.5;resize:vertical;outline:none}.btn{height:38px;padding:0 15px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#374151;font-size:13px;font-weight:600}.btn:hover{background:#f9fafb}.btn.primary{background:#6B829A;border-color:#6B829A;color:#fff}.btn.primary:hover{background:#556B7D}.btn.danger{color:#9A5A54;border-color:#EBCFCA;background:#fff}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(17,24,39,.45)}.modal.show{display:flex}.dialog{width:min(920px,96vw);max-height:90vh;display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.22)}.dialog-body{overflow:auto}.version-item.active{border-color:#6B829A;background:#E8EDF1}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#111827;color:#fff;border-radius:9px;padding:10px 16px;font-size:13px;transition:.2s;z-index:130}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:960px){#pbs-sidebar{display:none}.main{padding:20px 16px}.editor-grid{grid-template-columns:1fr}.field-grid{min-width:760px}}
  </style>
  <style>
    .search-select{position:relative}.program-selector-button{display:flex;width:100%;height:40px;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#374151;font-size:14px}.program-selector-button.open{border-color:#7D94A6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}#boundProgramSummary{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selector-panel{position:absolute;top:46px;right:0;left:0;z-index:80;display:none;max-height:288px;padding:8px;overflow:hidden;border:1px solid #dbe1e8;border-radius:10px;background:#fff;box-shadow:0 12px 28px rgba(15,23,42,.14)}.selector-panel.show{display:block}#schoolSelectorPanel{overflow-y:auto;overscroll-behavior:contain}#programOptions{max-height:226px;overflow-y:auto;overscroll-behavior:contain}.selector-search{width:100%;height:34px;margin-bottom:6px;padding:0 9px;border:1px solid #dbe1e8;border-radius:7px;outline:none;font-size:12px}.selector-search:focus{border-color:#7D94A6}.program-option,.school-option{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border:0;border-radius:7px;background:#fff;color:#475569;font-size:13px;text-align:left}.program-option:hover,.school-option:hover,.school-option:focus-visible{background:#f4f6f8;outline:none}.program-option input{width:16px;height:16px;accent-color:#647f96}
    .scope-tabs{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:12px 20px;border-bottom:1px solid #edf0f3}.scope-tab{flex:none;height:32px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:#fff;color:#64748b;font-size:12px}.scope-tab.active{border-color:#cdd6df;background:#edf1f5;color:#334155;font-weight:600}
    .page-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
    .page-tab{display:flex;min-width:150px;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border:0;border-radius:10px;background:#f4f6f8;color:#475569;text-align:left}
    .page-tab.active{background:#eaf2ff;color:#1d4ed8;box-shadow:inset 0 0 0 1px #c7dcff}
    .page-tab strong{font-size:13px}.page-tab small{font-size:10px;color:#94a3b8}.page-tab.active small{color:#60a5fa}
    .field-definition-grid{row-gap:28px!important;column-gap:32px!important}.field-definition{padding:18px 4px 24px;border-bottom:1px solid #e4e8ed;background:#fff}
    .field-definition-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .field-order{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:7px;background:#e6ebf2;color:#64748b;font-size:11px;font-weight:700}
    .field-control-grid{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px;gap:10px;align-items:end}
    .field-definition label{display:block;margin-bottom:6px;color:#64748b;font-size:11px;font-weight:600}
    .field-description{margin-top:10px}.main .input,.modal .input{min-width:0!important;max-width:100%}.template-info-grid>div{min-width:0}
    .field-read-name{font-size:15px;font-weight:600;color:#26364a;overflow-wrap:anywhere}.field-read-meta{display:flex;gap:16px;margin:12px 0;color:#7b8798;font-size:12px}.field-read-note{line-height:1.7;color:#66768b;font-size:13px;min-height:22px}.field-definition.is-editing{padding:18px;border-radius:12px;box-shadow:0 0 0 1px #dbe4ef}.entrance-tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #edf0f3}.entrance-row{display:grid;grid-template-columns:1fr 1.5fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f3}.entrance-row input{min-width:0}.entrance-default{font-size:12px;color:#64748b;display:flex;gap:8px;align-items:center}.page-manager{display:flex;align-items:center;gap:10px;padding:16px 20px 0}.page-manager .input{max-width:240px}.version-preview-table{width:100%;border-collapse:collapse;font-size:12px}.version-preview-table th,.version-preview-table td{text-align:left;padding:10px 12px;border-bottom:1px solid #edf0f4;vertical-align:top;overflow-wrap:anywhere}.version-preview-table th{color:#8290a3;font-weight:500}.version-preview-scroll{max-height:280px;overflow:auto}
    @media(max-width:1200px){.template-info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:960px){.template-info-grid{grid-template-columns:1fr}.field-definition-grid{grid-template-columns:1fr}.field-control-grid{grid-template-columns:1fr 1fr}.field-control-grid>div:first-child{grid-column:1/-1}}
  </style>
  <script src="./assets/js/pbs-app.js" defer></script>
</head>
<body>
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="h-16 flex items-center justify-between px-6">
      <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 bg-white overflow-hidden"><img src="./PRD参考文件/导航栏图标参考.jpg" alt="PBS" class="w-full h-full object-contain"></div><span class="text-xl font-semibold text-gray-800">留学申请管理系统</span></div>
      <div class="flex items-center gap-3 pl-6 border-l border-gray-200"><span class="pbs-role-badge text-xs px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full font-medium">网申人员</span><div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center"><span class="text-white text-sm font-medium">王</span></div><span class="text-sm text-gray-700">王志强</span></div>
    </div>
  </header>
  <div class="layout">
    <aside id="pbs-sidebar" class="w-56 bg-white border-r border-gray-200 min-h-[calc(100vh-64px)] flex-shrink-0"></aside>
    <main class="main">
      <div class="pbs-detail-topbar">
        <div class="pbs-detail-topbar__main">
          <a href="网申模板库 - 留学申请管理系统.html" class="pbs-detail-back" aria-label="返回网申模板库" title="返回网申模板库">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </a>
          <div class="pbs-detail-topbar__copy">
            <div class="flex items-center gap-3"><h1 id="pageTitle" class="pbs-detail-topbar__title">修改网申模板</h1><span id="currentVersion" class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold">V3.2</span></div>
            <span id="breadcrumbMode" class="sr-only">修改模板</span>
          </div>
        </div>
        <div class="pbs-detail-topbar__actions"><button class="btn" onclick="openVersionHistory()">查看历史版本</button><button class="btn" onclick="saveNewVersion()">另存新版本</button><button class="btn primary" onclick="saveTemplate()">保存</button></div>
      </div>

      <section class="card p-5 mb-5">
        <div class="flex items-center justify-between mb-4"><h2 class="text-base font-semibold text-gray-900">模板信息</h2></div>
        <div class="template-info-grid grid grid-cols-4 gap-4">
          <div><label class="block text-sm text-gray-600 mb-2">模板名称 <span class="text-red-500">*</span></label><input id="templateName" class="input" placeholder="例如：CMU 多专业网申模板"></div>
          <div><label class="block text-sm text-gray-600 mb-2">绑定院校 <span class="text-red-500">*</span></label><div class="search-select"><input id="templateSchool" class="input" placeholder="搜索并选择院校" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="schoolSelectorPanel" onfocus="openSchoolSelector()" oninput="filterSchoolOptions()"><div id="schoolSelectorPanel" class="selector-panel" role="listbox"></div></div></div>
          <div><label class="block text-sm text-gray-600 mb-2">学院 <span class="text-red-500">*</span></label><input id="templateCollege" class="input" placeholder="手动填写学院名称"></div>
          <div><label class="block text-sm text-gray-600 mb-2">绑定专业 <span class="text-xs text-gray-400 font-normal">（选填）</span></label><div class="search-select"><button id="programSelectorButton" type="button" class="program-selector-button" aria-haspopup="listbox" aria-expanded="false" aria-controls="programSelectorPanel" onclick="toggleProgramSelector()"><span id="boundProgramSummary">请选择专业</span><span class="text-gray-400">⌄</span></button><div id="programSelectorPanel" class="selector-panel" role="listbox" aria-multiselectable="true"><input id="programSearch" class="selector-search" placeholder="搜索专业" autocomplete="off" oninput="filterProgramOptions()"><div id="programOptions"></div></div></div></div>
        </div>
      </section>

      <section class="card mb-5 overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100"><div><h2 class="text-base font-semibold text-gray-900">申请官网字段</h2><p class="text-xs text-gray-400 mt-1"><span id="activePageName">当前页面</span> · <span id="fieldCount">0</span> 个字段</p></div><div class="flex gap-2"><button class="btn" onclick="addApplicationPage()">添加页面</button><button class="btn primary" onclick="addFieldRow()">添加字段</button></div></div>
        <div class="entrance-tabs"><div id="entranceTabs" class="flex flex-wrap gap-2 flex-1"></div><button class="btn" onclick="openEntranceManager()">管理申请入口</button></div>
        <div id="programScopeTabs" class="scope-tabs"></div>
        <div class="px-5 pt-4 pb-3 border-b border-gray-100"><div id="applicationPageTabs" class="page-tabs"></div></div>
        <div class="page-manager"><input id="applicationPageName" class="input" aria-label="申请页面名称" onchange="renameApplicationPage(this.value)"><button class="text-xs text-gray-400 hover:text-red-600" onclick="deleteApplicationPage()">删除页面</button></div>
        <div id="fieldRows" class="field-definition-grid grid grid-cols-2 gap-x-6 px-5 pb-3"></div>
      </section>

      <section class="card overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200"><div><h2 class="text-base font-semibold text-gray-900">申请材料清单</h2><p class="text-xs text-gray-400 mt-1">共 <span id="materialCount">0</span> 项材料</p></div><button class="btn primary" onclick="addMaterialRow()">+ 添加材料</button></div>
        <div class="overflow-x-auto">
          <div class="field-grid grid grid-cols-[minmax(220px,1.2fr)_120px_minmax(300px,1.6fr)_64px] gap-3 px-5 py-3 bg-gray-50 text-xs font-medium text-gray-500"><span>材料名称</span><span>是否必需</span><span>材料要求</span><span>操作</span></div>
          <div id="materialRows" class="divide-y divide-gray-100"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="versionModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="versionModalTitle">
    <div class="dialog">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200"><div><h2 id="versionModalTitle" class="text-lg font-semibold text-gray-900">历史版本</h2><p class="text-xs text-gray-500 mt-1">选择版本查看当时保存的字段、材料数量与变更内容。</p></div><button class="w-8 h-8 rounded-lg bg-gray-100 text-gray-500 text-xl" onclick="closeVersionHistory()" aria-label="关闭">×</button></div>
      <div class="dialog-body grid grid-cols-[300px_1fr] min-h-[430px]">
        <div id="versionList" class="p-4 border-r border-gray-200 space-y-3 overflow-y-auto"></div>
        <div id="versionDetail" class="p-6"></div>
      </div>
      <div class="flex justify-end px-6 py-4 border-t border-gray-200"><button class="btn" onclick="closeVersionHistory()">关闭</button></div>
    </div>
  </div>
  <div id="editorToast" class="toast" role="status"></div>
  <div id="entranceModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="entranceModalTitle">
    <div class="dialog" style="max-width:760px">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200"><h2 id="entranceModalTitle" class="text-lg font-semibold">申请入口</h2><button class="text-2xl text-gray-400" aria-label="关闭申请入口" onclick="closeEntranceManager()">×</button></div>
      <div class="dialog-body p-6"><div id="entranceRows"></div><button class="btn mt-4" onclick="addEntranceRow()">添加入口</button><p id="entranceError" class="text-sm text-red-500 mt-3" role="alert"></p></div>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200"><button class="btn" onclick="closeEntranceManager()">取消</button><button class="btn primary" onclick="saveEntrances()">确定</button></div>
    </div>
  </div>
  <script src="./网申模板编辑 - 留学申请管理系统.js"></script>
</body>
</html>
