<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网申模板库 - 留学申请管理系统</title>
  <script src="./assets/vendor/tailwind-runtime.js"></script>
  <link rel="stylesheet" href="./assets/css/pbs-theme.css?v=6.1">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937}button,input,select{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:calc(100vh - 64px);align-items:flex-start}.main{flex:1;min-width:0;padding:24px 28px 48px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}.input{height:40px;border:1px solid #d1d5db;border-radius:9px;padding:0 12px;background:#fff;font-size:14px;outline:none}.input:focus{border-color:#7D94A6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}.btn{height:38px;padding:0 15px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#374151;font-size:13px;font-weight:600}.btn:hover{background:#f9fafb}.btn.primary{background:#6B829A;border-color:#6B829A;color:#fff}.btn.primary:hover{background:#556B7D}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(17,24,39,.45)}.modal.show{display:flex}.dialog{width:min(980px,96vw);max-height:90vh;display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.22)}.dialog-body{overflow:auto;padding:20px 24px}.school-toggle{transition:transform .18s ease}.school-toggle.open{transform:rotate(90deg)}.version-tab{height:34px;padding:0 14px;border-radius:8px;color:#64748b;font-size:13px;font-weight:600}.version-tab.active{background:#e8edf1;color:#465d70}.scope-path{display:grid;grid-template-columns:minmax(160px,.8fr) 28px minmax(180px,.9fr) 28px minmax(220px,1.3fr);align-items:center;padding:4px 0 16px;border-bottom:1px solid #e5e7eb}.scope-path-arrow{text-align:center;color:#cbd5e1}.scope-path-node small{display:block;margin-bottom:5px;color:#94a3b8;font-size:10px}.scope-path-node strong{display:block;color:#334155;font-size:13px}.scope-programs{display:flex;flex-wrap:wrap;gap:7px}.bound-program-item{padding:6px 9px;border:1px solid #dbe1e8;border-radius:7px;color:#475569;font-size:11px}.detail-page-tab{padding:8px 12px;border:0;border-bottom:2px solid transparent;background:#fff;color:#64748b;font-size:12px}.detail-page-tab.active{border-bottom-color:#6B829A;color:#334155;font-weight:600}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#111827;color:#fff;border-radius:9px;padding:10px 16px;font-size:13px;transition:.2s;z-index:130}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:820px){#pbs-sidebar{display:none}.main{padding:20px 16px}.template-table{min-width:900px}.scope-path{grid-template-columns:1fr}.scope-path-arrow{display:none}.scope-path-node{padding:8px 0}}
  </style>
  <script src="./assets/js/pbs-app.js" defer></script>
<script src="./assets/js/pbs-template-publishing.js?v=1.0"></script>
<link rel="stylesheet" href="./assets/css/pbs-template-publishing.css?v=1.0">
</head>
<body>
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="h-16 flex items-center justify-between px-6">
      <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center bg-white overflow-hidden"><img src="./PRD参考文件/导航栏图标参考.jpg" alt="PBS" class="w-full h-full object-contain"></div><span class="text-xl font-semibold text-gray-800">留学申请管理系统</span></div>
      <div class="flex items-center gap-3 pl-6 border-l border-gray-200"><span class="pbs-role-badge text-xs px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full font-medium">网申人员</span><div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center"><span class="text-white text-sm font-medium">王</span></div><span class="text-sm text-gray-700">王志强</span></div>
    </div>
  </header>
  <div class="layout">
    <aside id="pbs-sidebar" class="w-56 bg-white border-r border-gray-200 min-h-[calc(100vh-64px)] flex-shrink-0"></aside>
    <main class="main">
      <div class="flex items-center justify-between gap-5 mb-6">
        <h1 class="text-2xl font-semibold text-gray-900">网申模板库</h1>
        <button class="btn primary" onclick="openTemplateEditor()">新增模板</button>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-5">
        <div class="card p-5"><p class="text-sm text-gray-500">模板数量</p><p id="templateCount" class="text-2xl font-bold text-gray-900 mt-2">0</p></div>
        <div class="card p-5"><p class="text-sm text-gray-500">覆盖院校</p><p id="templateSchoolCount" class="text-2xl font-bold text-gray-900 mt-2">0</p></div>
      </div>

      <section class="card p-5 mb-5">
        <div class="flex items-end gap-4 flex-wrap">
          <div class="flex-1 min-w-[240px]"><label class="block text-sm text-gray-600 mb-2">院校 / 学院 / 专业</label><input id="templateKeyword" class="input w-full" placeholder="搜索院校、学院、模板或专业" oninput="filterTemplates()"></div>
          <div><label class="block text-sm text-gray-600 mb-2">国家 / 地区 <span class="text-xs text-gray-400 font-normal">（选填）</span></label><input id="templateRegion" class="input w-36" placeholder="手动输入" oninput="filterTemplates()"></div>
          <div><label class="block text-sm text-gray-600 mb-2">所属机构</label><select id="templateOrganization" class="input min-w-40" onchange="filterTemplates()"><option value="">全部机构</option><option>PBS留学总部</option><option>上海启明留学</option><option>北京知行教育</option></select></div>
          <button class="btn" onclick="resetTemplateFilter()">重置</button>
        </div>
      </section>

      <section class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full template-table">
            <thead class="bg-gray-50"><tr><th class="px-5 py-4 text-left text-sm font-medium text-gray-500">院校 / 学院</th><th class="px-5 py-4 text-left text-sm font-medium text-gray-500">模板名称</th><th class="px-5 py-4 text-left text-sm font-medium text-gray-500">所属机构</th><th class="px-5 py-4 text-left text-sm font-medium text-gray-500">绑定专业</th><th class="px-5 py-4 text-left text-sm font-medium text-gray-500">操作</th></tr></thead>
            <tbody id="templateRows" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
        <div id="templateEmpty" class="hidden py-12 text-center text-sm text-gray-400">暂无符合条件的模板</div>
      </section>
    </main>
  </div>

  <div id="templateDetailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="templateDetailTitle">
    <div class="dialog">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200"><div><h2 id="templateDetailTitle" class="text-lg font-semibold text-gray-900"></h2><p id="templateDetailMeta" class="text-xs text-gray-500 mt-1"></p></div><button class="w-8 h-8 rounded-lg bg-gray-100 text-gray-500 text-xl" onclick="closeTemplateDetail()" aria-label="关闭">×</button></div>
      <div class="dialog-body">
        <div id="templateVersionTabs" class="flex items-center gap-2 p-1 bg-gray-100 rounded-xl mb-5 overflow-x-auto"></div>
        <section class="mb-5"><h3 class="text-sm font-semibold text-gray-800 mb-3">适用范围</h3><div id="templateBoundPrograms" class="scope-path"></div></section>
        <div class="grid grid-cols-2 gap-5">
          <section><h3 class="text-sm font-semibold text-gray-800 mb-3">申请官网字段</h3><div class="border border-gray-200 rounded-lg overflow-hidden"><div id="templatePages" class="flex overflow-x-auto px-2 border-b border-gray-200"></div><div id="templateFields" class="divide-y divide-gray-100"></div></div></section>
          <section><h3 class="text-sm font-semibold text-gray-800 mb-3">申请材料清单</h3><div id="templateMaterials" class="border border-gray-200 rounded-lg divide-y divide-gray-100"></div></section>
        </div>
        <div id="templateReviewNote" class="mt-5 p-3 bg-yellow-50 border border-yellow-200 rounded-lg text-xs text-yellow-800"></div>
      </div>
      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200"><button class="btn" onclick="closeTemplateDetail()">关闭</button><button class="btn primary" onclick="editCurrentTemplate()">编辑模板</button></div>
    </div>
  </div>
  <script src="./网申模板库 - 留学申请管理系统.js"></script>
<script src="./assets/js/pbs-template-center.js?v=1.0"></script>
</body>
</html>
