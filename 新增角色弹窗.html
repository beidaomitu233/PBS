<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增角色</title>
  <script src="./assets/vendor/tailwind-runtime.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:transparent;color:#1f2937}.role-dialog{width:100%;max-height:86vh;overflow:hidden;border:1px solid #e5e7eb;border-radius:14px;background:#fff;box-shadow:0 24px 64px rgba(15,23,42,.24)}.dialog-head{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 22px;border-bottom:1px solid #e5e7eb}.dialog-head h1{margin:0;font-size:18px;font-weight:700}.dialog-close{width:32px;height:32px;border:0;border-radius:8px;background:#f3f4f6;color:#6b7280;font-size:20px}.role-form{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 68px;height:calc(86vh - 60px)}.basic-panel{padding:20px;border-right:1px solid #e5e7eb;background:#f8fafc}.field{margin-bottom:16px}.field label,.permissions-title{display:block;margin-bottom:7px;color:#374151;font-size:13px;font-weight:600}.field input[type="text"],.field textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#1f2937;font-size:13px;outline:none}.field input[type="text"]{height:40px;padding:0 11px}.field textarea{height:88px;padding:10px 11px;resize:none}.field input:focus,.field textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.1)}.status-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status-option{display:flex;align-items:center;justify-content:center;gap:7px;height:38px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#4b5563;font-size:13px;cursor:pointer}.status-option:has(input:checked){border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}.status-option input{accent-color:#2563eb}.permissions-panel{min-width:0;padding:18px 20px;overflow:auto}.permissions-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.permissions-title{margin:0;font-size:14px}.permission-groups{display:grid;gap:10px}.permission-section{overflow:hidden;border:1px solid #e5e7eb;border-radius:10px;background:#fff}.permission-section[open]{box-shadow:0 1px 2px rgba(15,23,42,.04)}.permission-section summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;background:#f8fafc;color:#1f2937;font-size:13px;font-weight:700;cursor:pointer;list-style:none}.permission-section summary::-webkit-details-marker{display:none}.permission-section summary:after{content:'⌄';color:#94a3b8;font-size:16px;transition:transform .15s}.permission-section[open] summary:after{transform:rotate(180deg)}.permission-section-body{padding:2px 14px 10px}.permission-page{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid #eef2f7}.permission-page:first-child{border-top:0}.permission-page-name{display:flex;align-items:flex-start;gap:7px;color:#374151;font-size:13px;font-weight:600}.permission-items{display:flex;gap:7px;flex-wrap:wrap}.permission-item{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:5px 9px;border:1px solid #dbe3ea;border-radius:7px;background:#fff;color:#4b5563;font-size:12px;cursor:pointer}.permission-item:has(input:checked){border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}.permission-item input,.permission-page-name input{margin:1px 0 0;accent-color:#2563eb}.dialog-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 20px;border-top:1px solid #e5e7eb;background:#fff}.form-error{color:#dc2626;font-size:12px}.dialog-actions{display:flex;gap:10px}.btn{height:38px;padding:0 18px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#374151;font-size:13px;font-weight:600}.btn.primary{border-color:#2563eb;background:#2563eb;color:#fff}.empty-permissions{padding:36px;color:#94a3b8;font-size:13px;text-align:center}@media(max-width:760px){body{padding:0!important}.role-dialog{max-height:94vh}.role-form{display:flex;height:calc(94vh - 60px);flex-direction:column;overflow:auto}.basic-panel{border-right:0;border-bottom:1px solid #e5e7eb}.permissions-panel{overflow:visible}.permission-page{grid-template-columns:1fr}.dialog-foot{position:sticky;bottom:0}.dialog-actions{margin-left:auto}}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3">
  <div class="role-dialog">
    <div class="dialog-head"><h1>新增角色</h1><button class="dialog-close" type="button" onclick="closeModal()">×</button></div>
    <form class="role-form" onsubmit="submitRole(event)">
      <section class="basic-panel">
        <div class="field"><label for="roleName">角色名称</label><input id="roleName" type="text" maxlength="30" placeholder="请输入角色名称"></div>
        <div class="field"><label for="roleDesc">角色描述</label><textarea id="roleDesc" maxlength="100" placeholder="请输入角色描述"></textarea></div>
        <div class="field"><label>角色状态</label><div class="status-options"><label class="status-option"><input type="radio" name="roleStatus" value="启用" checked>启用</label><label class="status-option"><input type="radio" name="roleStatus" value="禁用">禁用</label></div></div>
      </section>
      <section class="permissions-panel">
        <div class="permissions-head"><h2 class="permissions-title">权限设置</h2></div>
        <div id="permModules" class="permission-groups"></div>
      </section>
      <footer class="dialog-foot"><p id="roleFormError" class="form-error hidden"></p><div class="dialog-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn primary">创建角色</button></div></footer>
    </form>
  </div>
  <script src="./assets/js/pbs-app.js?v=6.0"></script>
  <script>
    var modules = (window.pbsPermissionTree || []).slice();
    var parentRoles = [];
    try {
      if (parent.pbsPermissionTree && parent.pbsPermissionTree.length) modules = parent.pbsPermissionTree;
      else if (parent.permissionModules && parent.permissionModules.length) modules = parent.permissionModules;
      if (parent.roles && parent.roles.length) parentRoles = parent.roles;
    } catch (e) {}
    /* 按业务模块把页面分组归并成分区，没有 module 字段时（旧版副本）归到「功能模块」 */
    function groupedSections() {
      var sections = [];
      var indexOfModule = {};
      modules.forEach(function (group) {
        var key = group.module || '功能模块';
        if (!(key in indexOfModule)) {
          indexOfModule[key] = sections.length;
          sections.push({ module: key, pages: [] });
        }
        sections[indexOfModule[key]].pages.push(group);
      });
      return sections;
    }

    function renderPermModules() {
      if (!modules.length) {
        document.getElementById('permModules').innerHTML = '<div class="empty-permissions">权限数据加载失败，请关闭后重试</div>';
        return;
      }
      var html = '';
      groupedSections().forEach(function (section, sectionIndex) {
        html += '<details class="permission-section"' + (sectionIndex === 0 ? ' open' : '') + '>' +
          '<summary><span>' + section.module + '</span></summary><div class="permission-section-body">';
        section.pages.forEach(function (mod) {
          html += '<div class="permission-page">' +
            '<label class="permission-page-name"><input type="checkbox" onchange="toggleModuleAll(\'' + mod.id + '\', this.checked)"><span>' + mod.name + '</span></label>' +
            '<div class="permission-items">' +
            mod.items.map(function (item) {
              return '<label class="permission-item">' +
                '<input type="checkbox" data-module="' + mod.id + '" value="' + item.id + '">' +
                item.label + '</label>';
            }).join('') +
            '</div></div>';
        });
        html += '</div></details>';
      });
      document.getElementById('permModules').innerHTML = html;
    }

    function toggleModuleAll(modId, checked) {
      document.querySelectorAll('#permModules input[data-module="' + modId + '"]').forEach(function (cb) {
        cb.checked = checked;
      });
    }

    function collectPermissions() {
      var perms = {};
      modules.forEach(function (mod) {
        perms[mod.id] = Array.from(document.querySelectorAll('#permModules input[data-module="' + mod.id + '"]:checked'))
          .map(function (cb) { return cb.value; });
      });
      return perms;
    }

    function closeModal() {
      if (parent !== window) parent.postMessage('pbs:close', '*');
      else location.href = '角色权限管理 - 留学申请管理系统.html';
    }

    function submitRole(event) {
      event.preventDefault();
      var err = document.getElementById('roleFormError');
      var name = document.getElementById('roleName').value.trim();
      if (!name) { err.textContent = '请输入角色名称'; err.classList.remove('hidden'); return; }
      if (parentRoles.some(function (role) { return role.name === name; })) { err.textContent = '角色名称已存在'; err.classList.remove('hidden'); return; }
      err.classList.add('hidden');
      var statusRadio = document.querySelector('input[name="roleStatus"]:checked');
      var data = {
        name: name,
        description: document.getElementById('roleDesc').value.trim(),
        status: statusRadio ? statusRadio.value : '启用',
        permissions: collectPermissions()
      };
      if (parent !== window) {
        parent.postMessage({ type: 'pbs:add-role', payload: data }, '*');
      } else {
        localStorage.setItem('pbs_pending_role_v1', JSON.stringify(data));
        location.href = '角色权限管理 - 留学申请管理系统.html';
      }
    }

    renderPermModules();
  </script>
</body>
</html>
