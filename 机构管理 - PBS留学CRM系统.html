<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机构管理 - PBS留学CRM系统</title>
  <script src="./assets/vendor/tailwind-runtime.js"></script>
  <link rel="stylesheet" href="./assets/css/pbs-theme.css?v=6.7">
  <link rel="stylesheet" href="./assets/css/pbs-organizations.css?v=1.0">
  <link rel="stylesheet" href="./assets/css/pbs-privacy.css?v=1.5">
  <style>
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    #pbs-sidebar { min-height: calc(100vh - 56px); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pbs-primary-page pbs-organization-page">
  <header class="h-14 bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="h-full px-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 bg-white overflow-hidden"><img src="./PRD参考文件/导航栏图标参考.jpg" alt="PBS" class="w-full h-full object-contain"></div>
        <div><p class="text-sm font-semibold text-gray-900">PBS 留学申请管理平台</p><p class="text-xs text-gray-400">机构 SaaS 管理</p></div>
      </div>
      <div class="flex items-center gap-4">
        <button data-dom-id="btn-notification" class="relative w-9 h-9 rounded-lg text-gray-500 hover:bg-gray-100" aria-label="系统消息">🔔<span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-red-500"></span></button>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 text-white flex items-center justify-center"><span class="text-sm">王</span></div>
          <span class="text-sm text-gray-700">平台运营人员</span>
        </div>
      </div>
    </div>
  </header>

  <div class="flex">
    <aside id="pbs-sidebar" class="w-56 bg-white border-r border-gray-200 flex flex-col flex-shrink-0"></aside>
    <main class="flex-1 min-w-0 p-6">
      <div class="org-heading"><h1>机构管理</h1><button type="button" class="org-btn" onclick="pbsPrivacy.manage()" data-pbs-permission="sys_org"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 3v5c0 4.5-3 8.4-7 10-4-1.6-7-5.5-7-10V6l7-3z"/><path d="m9 12 2 2 4-4"/></svg>协议配置</button></div>
      <div class="org-stats">
        <div class="org-stat"><p>机构总数</p><strong id="organizationTotal">44</strong></div>
        <div class="org-stat"><p>已有成员机构</p><strong id="organizationStaffed">7</strong></div>
        <div class="org-stat"><p>暂无成员机构</p><strong id="organizationEmpty">37</strong></div>
      </div>
      <section class="org-list" aria-label="机构列表">
        <form class="org-search" onsubmit="searchOrganizations(event)">
          <div><label for="organizationSearch">关键词搜索</label><input id="organizationSearch" type="search" placeholder="输入机构名称"></div>
          <button type="submit" class="org-btn primary">搜索</button><button type="button" class="org-btn" onclick="resetOrganizationSearch()">重置</button>
        </form>
        <div class="org-table-wrap"><table class="org-table"><thead><tr><th>LOGO</th><th>机构名称</th><th>创建时间</th><th>机构成员</th><th>状态</th><th>操作</th></tr></thead><tbody id="organizationTableBody"></tbody></table></div>
        <div id="organizationEmptyState" class="org-empty hidden">未找到匹配的机构</div>
        <div class="org-pagination"><span id="organizationResultCount"></span><nav id="organizationPagination" aria-label="机构列表分页"></nav></div>
      </section>
    </main>
  </div>

  <script src="./assets/js/pbs-organization-data.js?v=1.1"></script>

  <script src="./assets/js/pbs-app.js?v=8.8"></script>
  <script src="./assets/js/pbs-privacy.js?v=1.6"></script>
  <script src="./assets/js/pbs-organizations.js?v=1.0"></script>
</body>
</html>
