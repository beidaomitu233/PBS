<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>登录 - PBS留学申请管理平台</title>
  <script src="./assets/vendor/tailwind-runtime.js"></script>
  <link rel="stylesheet" href="./assets/css/pbs-login.css?v=1.1">
  <link rel="stylesheet" href="./assets/css/pbs-privacy.css?v=1.5">
</head>
<body class="login-page">
  <div class="login-tools">
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="切换深色模式" aria-pressed="false" onclick="toggleLoginTheme()"><span></span><span aria-hidden="true">🌙</span></button>
    <button type="button" class="language-toggle" aria-label="切换中英文" onclick="toggleLoginLanguage()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 5h12M9 3v2m4 0c-1 6-4 9-9 12m1-9c1 4 4 7 8 9m1 4 4-11 4 11m-6-4h4"/></svg></button>
  </div>
  <main class="login-card">
    <div class="login-brand"><img src="./assets/images/login-brand.png" alt="C Choice 荆意教育科技 · 壹言聚学"></div>
    <section class="login-panel" aria-label="用户登录">
      <div class="login-tabs" role="tablist" aria-label="登录方式">
        <button id="passwordLoginTab" type="button" class="login-tab active" role="tab" aria-selected="true" onclick="switchLoginMode('password')">密码登录</button>
        <button id="smsLoginTab" type="button" class="login-tab" role="tab" aria-selected="false" tabindex="-1" onclick="switchLoginMode('sms')">验证码登录</button>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <label id="loginAccountLabel" for="username" class="sr-only">账号</label>
        <div class="login-field">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 9 4v6c0 5-5 9-9 11-4-2-9-6-9-11V6l9-4z"/><path d="m7 12 3 3 7-7" fill="none" stroke="#fff" stroke-width="1.8"/></svg>
          <input type="text" id="username" autocomplete="username" placeholder="账号" required>
        </div>
        <div id="passwordField" class="login-field">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 10V7a6 6 0 0 1 12 0v3h1a2 2 0 0 1 2 2v9H3v-9a2 2 0 0 1 2-2h1zm3 0h6V7a3 3 0 0 0-6 0v3z"/></svg>
          <label for="password" class="sr-only">密码</label><input type="password" id="password" autocomplete="current-password" placeholder="密码" required>
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="显示密码" onclick="togglePassword()"><svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div id="captchaField" class="login-field">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 9 4v6c0 5-5 9-9 11-4-2-9-6-9-11V6l9-4z"/><path d="m7 12 3 3 7-7" fill="none" stroke="#fff" stroke-width="1.8"/></svg>
          <label for="captcha" class="sr-only">图形验证码</label><input type="text" id="captcha" autocomplete="off" maxlength="4" placeholder="验证码" required>
          <button type="button" class="captcha-button" aria-label="刷新图形验证码" title="点击刷新验证码" onclick="refreshCaptcha()"><canvas id="captchaCanvas" width="120" height="42" aria-hidden="true"></canvas></button>
        </div>
        <div id="smsField" class="login-field hidden">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 9 4v6c0 5-5 9-9 11-4-2-9-6-9-11V6l9-4z"/><path d="m7 12 3 3 7-7" fill="none" stroke="#fff" stroke-width="1.8"/></svg>
          <label for="smsCode" class="sr-only">短信验证码</label><input type="text" inputmode="numeric" maxlength="6" id="smsCode" autocomplete="one-time-code" placeholder="请输入验证码">
          <button id="sendSmsButton" class="sms-send" type="button" onclick="sendSmsCode()">获取验证码</button>
        </div>
        <div class="login-consent" id="privacyConsentRow">
          <input type="checkbox" id="privacyConsent" aria-describedby="loginFeedback" onchange="privacyConsentChanged()">
          <span class="login-consent-text"><label for="privacyConsent" id="consentLabel">我已阅读并同意</label><button type="button" id="userPolicyLink" onclick="readUserPolicy()">《用户政策》</button><span class="login-consent-sep" id="policyAndLabel">和</span><button type="button" id="privacyLink" onclick="readPrivacy()">《隐私协议》</button></span>
        </div>
        <button type="submit" class="login-submit" id="loginSubmit">登录</button>
        <p id="loginFeedback" class="login-feedback" role="status" aria-live="polite"></p>
      </form>
      <div class="login-divider" id="loginDivider">其他登录方式</div>
      <button type="button" class="wechat-button" onclick="openWechatLogin()">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.7 4C5 4 2 6.55 2 9.7c0 1.8.98 3.4 2.5 4.45l-.63 2.17 2.55-1.28c.72.2 1.49.31 2.28.31.25 0 .5 0 .74-.04a5.4 5.4 0 0 1-.14-1.2c0-3.15 2.99-5.7 6.7-5.7.4 0 .8.03 1.18.08C16.2 5.77 12.86 4 8.7 4Zm-2 3.4a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Zm4.6 0a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8ZM22 15.2c0-2.6-2.69-4.7-6-4.7s-6 2.1-6 4.7 2.69 4.7 6 4.7c.66 0 1.3-.08 1.9-.23l2.23 1.12-.55-1.88C21.06 18.04 22 16.7 22 15.2Zm-8-1.6a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Zm4 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Z"/></svg><span id="wechatLabel">微信扫码登录</span>
      </button>
    </section>
  </main>
  <script src="./assets/js/pbs-app.js?v=8.8"></script>
  <script src="./assets/js/pbs-privacy.js?v=1.6"></script>
  <script src="./assets/js/pbs-login.js?v=1.1"></script>
</body>
</html>
