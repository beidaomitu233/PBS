<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>filter-harness</title></head>
<body>
<pre id="results">START</pre>
<script>
var pages = [
  '学生档案列表页 - 留学申请管理系统.html',
  '项目池列表页 - 留学申请管理系统.html',
  '我的项目列表页 - 留学申请管理系统.html',
  '任务列表页 - 文书交付系统.html',
  '模板库列表 - 文书交付系统.html',
  '案例库 - 文书交付系统.html',
  '文书审核列表页 - 留学申请管理系统.html',
  '网申任务列表页 - 留学申请管理系统.html',
  '网申模板库 - 留学申请管理系统.html',
  '监控任务列表 - PBS留学CRM.html',
  '结项归档列表 - PBS留学CRM系统.html',
  '选校任务列表页 - 留学申请管理系统.html',
  '机构管理 - PBS留学CRM系统.html',
  '人员管理 - PBS留学CRM系统.html',
  '操作日志审计 - 留学申请管理系统.html'
];
var special = { '人员管理 - PBS留学CRM系统.html': '?org=ORG-100001' };
function log(s) { document.getElementById('results').textContent += '\n' + s; }
function testPage(i) {
  if (i >= pages.length) { log('ALL_PAGES_DONE'); return; }
  var name = pages[i];
  var iframe = document.createElement('iframe');
  iframe.style.width = '1280px'; iframe.style.height = '800px';
  var done = false;
  function finish(msg) {
    if (done) return; done = true;
    log(name + ' => ' + msg);
    if (iframe.parentNode) document.body.removeChild(iframe);
    setTimeout(function () { testPage(i + 1); }, 50);
  }
  var guard = setTimeout(function () { finish('LOAD_TIMEOUT'); }, 10000);
  iframe.onload = function () {
    setTimeout(function () {
      try {
        var doc = iframe.contentDocument;
        var root = doc.querySelector('#pbsFilterRoot');
        if (!root) { clearTimeout(guard); finish('NO_ROOT'); return; }
        var bar = root.classList.contains('pbs-filter-bar');
        var groups = root.querySelectorAll('.pbs-filter-group').length;
        var dds = root.querySelectorAll('.pbs-filter-dd').length;
        var body = root.querySelector('.pbs-filter-body');
        var toggle = root.querySelector('.pbs-filter-collapse-btn');
        var collapse = 'NA';
        if (body && toggle) {
          var b = body.style.display; toggle.click();
          var a = body.style.display; toggle.click();
          var c = body.style.display;
          collapse = (b !== a && c === b) ? 'OK' : ('FAIL[' + b + '/' + a + '/' + c + ']');
        }
        function visCount() {
          var rows = [].slice.call(doc.querySelectorAll('tbody tr')).filter(function (tr) { return tr.offsetParent !== null; });
          if (rows.length) return rows.length;
          var cards = [].slice.call(doc.querySelectorAll('.grid > *')).filter(function (el) { return el.offsetParent !== null; });
          return cards.length;
        }
        var cb = root.querySelector('.pbs-filter-checks input[type=checkbox]');
        var filter = 'NA';
        if (cb) {
          var c0 = visCount(); cb.click();
          var c1 = visCount(); cb.click();
          var c2 = visCount();
          filter = (c2 === c0 ? 'restore-ok' : 'restore-FAIL') + '(' + c0 + '->' + c1 + '->' + c2 + ')';
        }
        clearTimeout(guard);
        finish('bar=' + (bar ? 'Y' : 'N') + ' groups=' + groups + ' dd=' + dds + ' collapse=' + collapse + ' filter=' + filter);
      } catch (e) { clearTimeout(guard); finish('ERR:' + e.message); }
    }, 1600);
  };
  iframe.src = name + (special[name] || '');
  document.body.appendChild(iframe);
}
testPage(0);
</script>
</body>
</html>
